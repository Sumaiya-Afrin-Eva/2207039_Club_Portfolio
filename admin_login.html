<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Admin Login - Club Portfolio</title>
    <script>
        // Mark when this page is being loaded
        window.loginLoadTimestamp = new Date().getTime();
        
        // CRITICAL: Check if already logged in IMMEDIATELY before page renders
        // If logged in, redirect to dashboard
        (function() {
            const sessionCheckUrl = '/Club_Portfolio/api/auth.php?action=current_user&t=' + window.loginLoadTimestamp;
            
            // Use synchronous fetch via XMLHttpRequest for immediate blocking check
            const xhr = new XMLHttpRequest();
            xhr.open('GET', sessionCheckUrl, false); // synchronous
            xhr.setRequestHeader('Cache-Control', 'no-cache, no-store, must-revalidate');
            xhr.setRequestHeader('Pragma', 'no-cache');
            
            try {
                xhr.send();
                const response = JSON.parse(xhr.responseText);
                
                // If session valid, redirect to dashboard
                if (response && response.status === 'success') {
                    window.location.replace('/Club_Portfolio/admin_dashboard.html');
                    // Stop rendering login page
                    document.documentElement.style.display = 'none';
                }
            } catch(e) {
                // On error, allow login page to load (user might not be logged in)
                console.log('Session check error:', e);
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .alert.show {
            display: block;
        }

        .info {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 13px;
            color: #333;
            border-left: 4px solid #667eea;
        }

        .info strong {
            display: block;
            margin-bottom: 8px;
        }

        .info p {
            margin: 5px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Admin Login</h1>

        <div id="alert" class="alert alert-error"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="button">Login</button>
        </form>

        <div class="info">
            <strong>Demo Credentials:</strong>
            <p>Email: admin@clubportfolio.com</p>
            <p>Password: Admin@123</p>
            <p style="margin-top: 10px; font-size: 12px; color: #999;">
                Change password after first login
            </p>
        </div>
    </div>

    <script>
        const API_BASE = '/Club_Portfolio/api/';
        
        // AGGRESSIVE: Prevent page from being cached in browser's back-forward cache
        
        // 1. popstate - prevent back button from navigating away
        window.addEventListener('popstate', function(event) {
            // Just stay on login page by pushing state again
            history.pushState({page: 'admin_login', timestamp: new Date().getTime()}, '', window.location.href);
        });

        // 2. beforeunload - adds overhead that discourages caching
        window.addEventListener('beforeunload', function(e) {
            return void 0;
        });
        
        // 3. unload - marks page as unsafe to cache
        window.addEventListener('unload', function() {
            // This prevents some browsers from caching with bfcache
        });
        
        // 4. pagehide - fires when leaving page, including back button
        window.addEventListener('pagehide', function(event) {
            // If user is navigating away, clear data
            if (!event.persisted) {
                sessionStorage.removeItem('admin_logout_time');
            }
        });
        
        // 5. pageshow - fires when page is shown, including from bfcache
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                // Page was restored from back-forward cache
                // Force re-validation of session
                const sessionCheckUrl = '/Club_Portfolio/api/auth.php?action=current_user&t=' + new Date().getTime();
                
                const xhr = new XMLHttpRequest();
                xhr.open('GET', sessionCheckUrl, false); // synchronous
                xhr.setRequestHeader('Cache-Control', 'no-cache, no-store, must-revalidate');
                
                try {
                    xhr.send();
                    const response = JSON.parse(xhr.responseText);
                    
                    // If already logged in, redirect to dashboard
                    if (response && response.status === 'success') {
                        window.location.replace('/Club_Portfolio/admin_dashboard.html');
                    }
                } catch(e) {
                    // On error, stay on login page
                    console.log('Session check error on pageshow:', e);
                }
            }
            sessionStorage.removeItem('admin_logout_time');
        });

        // Push initial state when page loads
        window.addEventListener('load', function() {
            history.pushState({page: 'admin_login', timestamp: new Date().getTime()}, '', window.location.href);
            sessionStorage.removeItem('admin_logout_time');
            
            // Register service worker for additional cache control (Chrome compatibility)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/Club_Portfolio/sw.js').catch(err => {
                    console.log('Service worker registration failed (non-critical):', err);
                });
            }
        });

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            fetch(API_BASE + 'auth.php?action=login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password }),
                cache: 'no-store'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Clear logout marker if it exists
                    sessionStorage.removeItem('admin_logout_time');
                    // Redirect to admin dashboard
                    window.location.href = 'admin_dashboard.html';
                } else {
                    showError(data.message);
                }
            })
            .catch(error => {
                showError('Login failed. Please try again.');
                console.error('Error:', error);
            });
        }

        function showError(message) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.classList.add('show');

            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
