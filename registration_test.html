<!DOCTYPE html>
<html>
<head>
    <title>Registration Test</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; white-space: pre-wrap; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        label { display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registration API Test</h1>
        
        <label>Event ID:</label>
        <input type="number" id="eventId" value="1" placeholder="Event ID">
        
        <label>Name:</label>
        <input type="text" id="name" value="Test User" placeholder="Full Name">
        
        <label>Email:</label>
        <input type="email" id="email" value="test@example.com" placeholder="Email">
        
        <label>Phone:</label>
        <input type="tel" id="phone" value="01712345678" placeholder="Phone">
        
        <label>Address:</label>
        <input type="text" id="address" value="Test Address" placeholder="Address">
        
        <label>Institute:</label>
        <input type="text" id="institute" value="Test Institute" placeholder="Institute">
        
        <label>Gender:</label>
        <input type="text" id="gender" value="Male" placeholder="Gender">
        
        <label>Academic Year:</label>
        <input type="text" id="academic_year" value="2nd" placeholder="Academic Year">
        
        <label>Experience:</label>
        <input type="text" id="experience" value="Beginner" placeholder="Experience">
        
        <button onclick="testRegistration()">Test Registration API</button>
        <button onclick="testLoadEvents()">Test Load Events</button>
        <button onclick="clearResult()">Clear</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        function showResult(data, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = JSON.stringify(data, null, 2);
            resultDiv.className = 'result ' + (isError ? 'error' : 'success');
        }

        function clearResult() {
            document.getElementById('result').textContent = '';
        }

        async function testLoadEvents() {
            try {
                const response = await fetch('api/events.php?action=get_events');
                const data = await response.json();
                
                if (data.status === 'success' && data.data && data.data.length > 0) {
                    showResult({
                        status: 'SUCCESS',
                        message: 'Events loaded',
                        event_count: data.data.length,
                        first_event: data.data[0]
                    });
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function testRegistration() {
            const registrationData = {
                event_id: parseInt(document.getElementById('eventId').value),
                name: document.getElementById('name').value,
                email: document.getElementById('email').value + '.' + Date.now() + '@test.com', // Make unique
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                institute: document.getElementById('institute').value,
                gender: document.getElementById('gender').value,
                academic_year: document.getElementById('academic_year').value,
                experience: document.getElementById('experience').value
            };

            console.log('Sending:', registrationData);

            try {
                const response = await fetch('api/events.php?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registrationData)
                });

                console.log('Response Status:', response.status);
                const data = await response.json();
                console.log('Response:', data);

                showResult(data, data.status !== 'success');
            } catch (error) {
                showResult({ error: error.message }, true);
                console.error('Error:', error);
            }
        }

        // Test on load
        window.onload = function() {
            testLoadEvents();
        };
    </script>
</body>
</html>
